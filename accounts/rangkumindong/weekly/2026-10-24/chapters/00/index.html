<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — chapter</title>
<!-- ../../../../../../ is replaced by engine/weekly.py init with the path back to the repo root -->
<link rel="stylesheet" href="../../../../../../styles/sticker/sticker.css">
<link rel="stylesheet" href="../../../../../../styles/sticker/weekly/weekly.css">
<script src="../../../../../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<script src="../../build/week.js"></script>
<script src="../../../../../../styles/sticker/weekly/weekly.js"></script>
<style>
  /* ch 0 — intro: question hook, 6 topic stickers, tagline sting, dates + open loop */
  .q { font-weight: 900; font-size: 120px; letter-spacing: -4px; line-height: 1.02; text-align: center; white-space: nowrap; }
  .q .acc { color: var(--accent); }
  .topic { width: 480px; height: 330px; background: #fff; border-radius: 34px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; box-shadow: 0 0 0 10px #fff, 0 20px 30px rgba(27,36,48,.2); }
  .topic svg { width: 170px; height: 170px; }
  .topic b { font-weight: 900; font-size: 46px; letter-spacing: -1px; white-space: nowrap; }
  .topic.dim { filter: saturate(.6); }
  .big2 { font-weight: 900; text-align: center; line-height: .95; white-space: nowrap; }
  .big2 .l1 { font-size: 132px; letter-spacing: -5px; display: block; }
  .big2 .l2 { font-size: 150px; letter-spacing: -5px; color: var(--accent); display: block; margin-top: 14px; }
  .cal { display: flex; align-items: center; gap: 26px; background: var(--ink); color: #fff; border-radius: 26px; padding: 20px 34px;
    font-weight: 900; font-size: 52px; white-space: nowrap; }
  #lower1 { bottom: 215px; }
  .cal svg { width: 84px; height: 84px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <!-- ZONE A (960,540): question hook -->
    <div id="qA" class="abs q" style="left:960px; top:520px;">Kamu ketinggalan<br><span class="acc">yang mana?</span></div>

    <!-- ZONE B (960,1725): six topic stickers, 2 rows -->
    <div id="grid"></div>
    <div id="sting" class="abs stamp sticker" style="left:960px; top:1725px;">Rangkumin dong!</div>

    <!-- ZONE C (3160,1725): week title + open loop -->
    <div id="ttl" class="abs big2" style="left:3160px; top:1590px;"><span class="l1">RANGKUMIN SEMINGGU</span><span class="l2">17–23 OKT</span></div>
    <div id="calA" class="abs cal sticker" style="left:3160px; top:1860px;">
      <svg viewBox="0 0 100 100"><rect x="8" y="16" width="84" height="76" rx="12" fill="#fff"/><rect x="8" y="16" width="84" height="22" rx="10" fill="#FF5A36"/>
        <rect x="26" y="6" width="9" height="20" rx="4" fill="#fff"/><rect x="65" y="6" width="9" height="20" rx="4" fill="#fff"/>
        <g fill="#3E5568"><rect x="20" y="48" width="14" height="12" rx="3"/><rect x="43" y="48" width="14" height="12" rx="3"/><rect x="66" y="48" width="14" height="12" rx="3"/>
        <rect x="20" y="68" width="14" height="12" rx="3"/><rect x="43" y="68" width="14" height="12" rx="3"/></g><rect x="66" y="68" width="14" height="12" rx="3" fill="#FF5A36"/></svg>
      <span>Di akhir: tanggal minggu depan</span>
    </div>
  </div>
  <div id="card"><div class="kicker" id="cKick"></div><div class="title" id="cTitle"></div><div class="sub" id="cSub"></div></div>
  <div class="lower" id="lower1">Bab 7 · Minggu depan<small>tanggal yang wajib dicatat</small></div>
  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
// ---- chapter data: intro has no numbers besides the spoken dates (17–23 Oktober) ----
window.CHAPTER = Number(location.pathname.split('/').slice(-2)[0]);
const ICON = {
  chart: '<svg viewBox="0 0 100 100"><rect x="6" y="10" width="88" height="80" rx="12" fill="#E7E2D6"/><polyline points="16,60 32,72 48,78 62,52 76,42 88,24" fill="none" stroke="#FF5A36" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="80,18 94,18 92,32" fill="#FF5A36"/></svg>',
  bank: '<svg viewBox="0 0 100 100"><polygon points="50,8 92,32 8,32" fill="#1B2430"/><g fill="#3E5568"><rect x="16" y="38" width="10" height="38"/><rect x="36" y="38" width="10" height="38"/><rect x="54" y="38" width="10" height="38"/><rect x="74" y="38" width="10" height="38"/></g><rect x="8" y="80" width="84" height="12" rx="3" fill="#1B2430"/><circle cx="50" cy="23" r="5" fill="#FFD23F"/></svg>',
  flame: '<svg viewBox="0 0 100 100"><path d="M50 6 C62 26 82 38 80 64 C78 84 64 94 50 94 C34 94 20 84 20 64 C20 48 32 40 36 26 C42 36 44 42 48 44 C52 32 52 18 50 6Z" fill="#FF5A36"/><path d="M50 50 C58 60 66 66 64 78 C62 88 56 92 50 92 C42 92 36 86 36 78 C36 68 44 64 50 50Z" fill="#FFD23F"/></svg>',
  gavel: '<svg viewBox="0 0 100 100"><g transform="rotate(-40 50 50)"><rect x="24" y="16" width="44" height="22" rx="6" fill="#1B2430"/><rect x="18" y="12" width="10" height="30" rx="4" fill="#3E5568"/><rect x="64" y="12" width="10" height="30" rx="4" fill="#3E5568"/><rect x="42" y="38" width="9" height="50" rx="4" fill="#A0703C"/></g><rect x="50" y="80" width="42" height="12" rx="4" fill="#3E5568"/></svg>',
  wallet: '<svg viewBox="0 0 100 100"><rect x="18" y="16" width="56" height="30" rx="5" fill="#7CC38E" transform="rotate(-8 46 31)"/><rect x="8" y="28" width="84" height="62" rx="14" fill="#3E5568"/><rect x="58" y="48" width="34" height="22" rx="8" fill="#1B2430"/><circle cx="70" cy="59" r="5" fill="#FFD23F"/></svg>',
  rocket: '<svg viewBox="0 0 100 100"><g transform="rotate(35 50 50)"><path d="M50 4 C64 18 68 40 66 64 L34 64 C32 40 36 18 50 4Z" fill="#E7E2D6" stroke="#1B2430" stroke-width="4"/><circle cx="50" cy="34" r="8" fill="#3E5568"/><path d="M34 52 L20 72 L34 70Z M66 52 L80 72 L66 70Z" fill="#FF5A36"/><path d="M40 66 L50 92 L60 66Z" fill="#FFD23F"/></g></svg>',
};
// topic stickers: pop on the word that names them
const TOPICS = [
  { icon: 'chart',  label: 'IHSG bangkit',     at: () => K.word('i2', 'ihsg') },
  { icon: 'bank',   label: 'BI jalan tengah',  at: () => K.word('i2', 'bi') },
  { icon: 'flame',  label: 'Izin karhutla',    at: () => K.word('i2', 'presiden') },
  { icon: 'gavel',  label: 'Definisi korupsi', at: () => K.word('i3', 'debat') },
  { icon: 'wallet', label: 'Isi dompet kamu',  at: () => K.word('i3', 'isi') },
  { icon: 'rocket', label: 'Roket di sawit',   at: () => K.word('i3', 'roket') },
];
const FALLBACK = { n: 0, kicker: 'INTRO', title: 'Minggu ini' }, FALLBACK_DATES = '17–23 Okt 2026';
// -----------------------------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
// Subtitle pages: split long lines at punctuation so subtitles stay on one row (≤ ~48 chars) and clear the visuals.
K.pages = (lines, max = 48) => lines.flatMap((l) => {
  const len = (ws) => ws.map((x) => x.w).join(' ').length;
  const segs = []; let cur = [];
  l.words.forEach((w, i) => {   // 1) break at punctuation once a page has some substance
    cur.push(w);
    if (/[.,:;!?]$/.test(w.w) && len(cur) >= 12 && i < l.words.length - 1) { segs.push(cur); cur = []; }
  });
  if (cur.length) segs.push(cur);
  const out = [];
  segs.forEach((sg) => {        // 2) split a too-long segment into balanced pieces
    const n = Math.ceil(len(sg) / max), target = len(sg) / n; let piece = [];
    sg.forEach((w) => { if (piece.length && len(piece.concat(w)) > target + 2) { out.push(piece); piece = []; } piece.push(w); });
    out.push(piece);
  });
  return out.map((ws, k) => ({ id: l.id + '.' + k, start: ws[0].start, end: ws[ws.length - 1].end, words: ws }));
});
const SUBT = { ...T, lines: K.pages(T.lines) };
const ch = (window.WEEK?.chapters || []).find((c) => c.n === window.CHAPTER) || FALLBACK;
$('cKick').textContent = ch.kicker || ''; $('cTitle').textContent = ch.title || ''; $('cSub').textContent = window.WEEK?.dates || FALLBACK_DATES;

const ROT = [-3, 2, -2, 3, -2, 2];
const stickers = TOPICS.map((tp, i) => {
  const e = document.createElement('div'); e.className = 'abs topic';
  e.style.left = (960 + ((i % 3) - 1) * 580) + 'px'; e.style.top = (1545 + Math.floor(i / 3) * 400) + 'px';
  e.innerHTML = ICON[tp.icon] + `<b>${tp.label}</b>`; $('grid').appendChild(e);
  return { e, t: tp.at(), rot: ROT[i] };
});

const tRow2 = K.at('i3') - 0.25, tSting = K.at('rd'), tC = K.at('i4') - 0.2, tCal = K.word('i4', 'di');
const CAM = [
  { t: 0, x: 960, y: 540, z: 1 },
  { t: K.at('i2') - 0.3, x: 960, y: 1545, z: 1.1, dur: 0.8 },
  { t: tRow2, x: 960, y: 1800, z: 0.96, dur: 0.8 },
  { t: tSting - 0.4, x: 960, y: 1745, z: 0.86, dur: 0.6 },
  { t: tC, x: 3160, y: 1745, z: 1, dur: 0.9 },
];

function seek(t) {
  K.cam16($('world'), CAM, t);
  K.titleCard($('card'), t, 2.0);
  K.pop($('qA'), t, 2.05, K.at('i2') - 0.1);
  stickers.forEach((s) => {
    K.pop(s.e, t, s.t, Infinity, s.rot);
    s.e.style.opacity = t < s.t ? 0 : (t > tSting ? 1 - 0.45 * K.clamp((t - tSting) / 0.3) : 1) * K.clamp((t - s.t) / 0.08);
  });
  K.pop($('sting'), t, tSting, tC + 0.6, -4);
  K.pop($('ttl'), t, K.word('i4', 'rangkumin'), Infinity);
  K.pop($('calA'), t, tCal, Infinity, -2);
  K.lower($('lower1'), t, tCal + 0.6, Math.max(tCal + 1, T.duration - 0.5));
  window.TIMING = SUBT; K.subtitles($('subs'), t); window.TIMING = T;
  K.weekly(t);
}
window.seek = seek;
</script>
</body>
</html>
