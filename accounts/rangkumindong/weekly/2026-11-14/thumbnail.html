<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — thumbnail</title>
<link rel="stylesheet" href="{{ROOT}}styles/sticker/sticker.css">
<style>
  html, body { width: 1280px; height: 720px; }
  #stage { background: radial-gradient(circle at 1px 1px, rgba(62,85,104,.16) 1.6px, transparent 0) 0 0 / 30px 30px, var(--paper); }
  .badge { position: absolute; left: 60px; top: 50px; background: var(--ink); color: #fff; font-weight: 900; font-size: 36px; padding: 10px 22px; border-radius: 14px; }
  .num { position: absolute; left: 50px; top: 215px; font-weight: 900; font-size: 205px; letter-spacing: -8px; color: var(--ink); line-height: 1; white-space: nowrap; }
  .bar { position: absolute; left: 60px; top: 440px; background: var(--hi); color: var(--ink); font-weight: 900; font-size: 74px; letter-spacing: -2px; padding: 4px 22px; transform: rotate(-2deg); }
  .label { position: absolute; left: 66px; top: 545px; font-weight: 800; font-size: 28px; color: var(--slate); }
  .chip { position: absolute; left: 66px; top: 578px; border: 3px solid var(--slate); color: var(--slate); border-radius: 12px; padding: 4px 12px; font-weight: 800; font-size: 22px; }
  .dates { position: absolute; left: 60px; top: 644px; background: var(--ink); color: #fff; font-weight: 900; font-size: 26px; padding: 8px 16px; border-radius: 10px; }
  .title { position: absolute; right: 60px; top: 40px; width: 700px; text-align: right; font-weight: 900; font-size: 96px; letter-spacing: -3px; line-height: .95; color: var(--accent); }
  .stk { position: absolute; right: 60px; top: 425px; width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px 30px; }
  .stk div { background: #fff; border-radius: 20px; padding: 8px 14px; text-align: center; white-space: nowrap; font-weight: 900; font-size: 34px; letter-spacing: -1px; color: var(--ink); box-shadow: 0 0 0 9px #fff, 0 16px 26px rgba(27,36,48,.2); }
  .stk div small { display: block; font-size: 22px; font-weight: 800; color: var(--slate); letter-spacing: 0; margin-top: 4px; }
  .stk div:nth-child(1) { transform: rotate(-4deg); } .stk div:nth-child(2) { transform: rotate(3deg); }
  .stk div:nth-child(3) { transform: rotate(2deg); } .stk div:nth-child(4) { transform: rotate(-3deg); }
</style>
</head>
<body>
<div id="stage">
  <div class="badge" style="display:none"></div>
  <div class="num" id="num">+2,66%</div>
  <div class="bar">IHSG ▲</div>
  <div class="label">IHSG · Kamis 12 Nov</div>
  <div class="dates" id="dates">7–13 NOV 2026</div>
  <div class="title" id="title">DUA ORANG<br>MUNDUR</div>
  <div class="stk" id="stk">
    <div>Kursi wapres<small>kosong</small></div>
    <div>CEO Nvidia<small>mundur</small></div>
    <div>Kapolri<small>di DPR</small></div>
    <div>Rupiah<small>&gt;18.200</small></div>
  </div>
</div>
<script>
// The coordinator edits these four values per week (3–4 word title, one big verified number, 2–4 topic stickers).
window.FRAME = { w: 1280, h: 720 }; window.DURATION = 0.1; window.seek = () => {};
</script>
</body>
</html>
