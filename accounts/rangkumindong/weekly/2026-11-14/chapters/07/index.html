<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — chapter</title>
<!-- ../../../../../../ is replaced by engine/weekly.py init with the path back to the repo root -->
<link rel="stylesheet" href="../../../../../../styles/sticker/sticker.css">
<link rel="stylesheet" href="../../../../../../styles/sticker/weekly/weekly.css">
<script src="../../../../../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<script src="../../build/week.js"></script>
<script src="../../../../../../styles/sticker/weekly/weekly.js"></script>
<style>
  .q { position:absolute; left:960px; width:1700px; top:300px; text-align:center; font-weight:900; font-size:110px; letter-spacing:-3px; line-height:1.1; }
  .q .acc { color: var(--accent); }
  .chips { position:absolute; left:160px; top:480px; width:1600px; display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
  .fol { position:absolute; left:2960px; top:520px; width:1500px; text-align:center; }
  .fol .big { font-weight:900; font-size:130px; letter-spacing:-4px; }
  .fol .when { margin-top:30px; display:inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="q" id="q">Kabar mana yang paling <span class="acc">terasa</span> buat kamu?</div>
    <div class="chips" id="chips"></div>
    <div class="fol" id="fol"><div class="big">Follow <span style="color:var(--accent)">Rangkumin Dong</span></div><div class="tag accent sticker when">Rangkumin Seminggu, tiap Sabtu pagi!</div></div>
  </div>
  <div id="card"><div class="kicker" id="cKick"></div><div class="title" id="cTitle"></div><div class="sub" id="cSub"></div></div>
  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
window.CHAPTER = Number(location.pathname.split('/').slice(-2)[0]);
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
const ch = (window.WEEK?.chapters || []).find((c) => c.n === window.CHAPTER) || {};
$('cKick').textContent = ch.kicker || ''; $('cTitle').textContent = ch.title || ''; $('cSub').textContent = window.WEEK?.dates || '';
const topics = (window.WEEK?.chapters || []).filter((c) => c.n >= 1 && c.n <= 6).map((c) => c.title);
const chips = topics.map((tt, i) => { const e = document.createElement('div'); e.className = 'tag sticker' + (i % 3 === 0 ? ' accent' : i % 3 === 1 ? ' light' : ''); e.textContent = tt; $('chips').appendChild(e); return e; });
const L = T.lines, tB = L[Math.min(1, L.length - 1)].start;
function seek(t) {
  K.cam16($('world'), [{ t: 0, x: 960, y: 540, z: 1 }, { t: tB - 0.4, x: 960, y: 540, z: 1 }, { t: tB + 0.3, x: 2960, y: 540, z: 1 }], t);
  K.titleCard($('card'), t, 2.0);
  K.pop($('q'), t, 2.1);
  chips.forEach((e, i) => { const k = K.spring(t - 2.6 - i * 0.35); e.style.transform = `scale(${k})`; e.style.opacity = K.clamp(k * 2); });
  K.pop($('fol'), t, tB + 0.2);
  K.subtitles($('subs'), t);
  K.weekly(t);
}
window.seek = seek;
</script>
</body>
</html>
