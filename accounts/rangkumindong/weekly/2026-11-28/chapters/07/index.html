<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — chapter</title>
<link rel="stylesheet" href="../../../../../../styles/sticker/sticker.css">
<link rel="stylesheet" href="../../../../../../styles/sticker/weekly/weekly.css">
<script src="../../../../../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<script src="../../build/week.js"></script>
<script src="../../../../../../styles/sticker/weekly/weekly.js"></script>
<style>
  .it { position:absolute; transform:translate(-50%,-50%); opacity:0; width:max-content; max-width:1600px; box-sizing:border-box; }
  .nw { white-space:nowrap; }
  .big { font-weight:900; font-size:116px; letter-spacing:-4px; line-height:1.02; text-align:center; white-space:nowrap; }
  .big .acc, .hd .acc, .card .acc { color:var(--accent); }
  .hd { font-weight:900; font-size:66px; letter-spacing:-1.5px; text-align:center; white-space:nowrap; }
  .stat { font-weight:900; font-size:230px; letter-spacing:-9px; color:var(--accent); line-height:1; white-space:nowrap; }
  .stat.ink { color:var(--ink); } .stat.slate { color:var(--slate); }
  .lab { font-weight:800; font-size:44px; color:var(--slate); text-align:center; white-space:nowrap; }
  .card { background:#fff; border-radius:28px; padding:28px 42px; text-align:center; font-weight:900; font-size:54px; line-height:1.15;
          box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .card small { display:block; font-weight:700; font-size:32px; color:var(--slate); margin-top:10px; line-height:1.25; }
  .card .q { font-weight:800; font-size:30px; color:var(--slate); margin-bottom:10px; text-align:left; }
  .card.quote { text-align:left; border-left:16px solid var(--accent); }
  .card.ink { background:var(--ink); color:#fff; box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .card.ink small { color:#c9d3dc; }
  .card.dim { color:var(--slate); }
  .chip { background:var(--ink); color:#fff; font-weight:800; font-size:48px; padding:16px 30px; border-radius:18px; white-space:nowrap;
          box-shadow:0 0 0 8px #fff,0 14px 22px rgba(27,36,48,.2); }
  .chip.acc { background:var(--accent); } .chip.light { background:#fff; color:var(--ink); } .chip.hi { background:var(--hi); color:var(--ink); }
  .stamp { background:var(--accent); color:#fff; font-weight:900; font-size:84px; letter-spacing:-2px; padding:12px 34px; border-radius:18px;
           white-space:nowrap; box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .stamp.ink { background:var(--ink); }
  .arrow { font-weight:900; font-size:120px; color:var(--accent); line-height:1; }
  .cal { width:300px; background:#fff; border-radius:26px; overflow:hidden; text-align:center; box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .cal .d { background:var(--accent); color:#fff; font-weight:900; font-size:40px; padding:12px 0; letter-spacing:2px; }
  .cal.ink .d { background:var(--ink); }
  .cal .n { font-weight:900; font-size:150px; letter-spacing:-6px; line-height:1.05; padding-top:6px; }
  .cal .m { font-weight:800; font-size:40px; color:var(--slate); padding-bottom:18px; letter-spacing:2px; }
  .cal.sm { width:220px; } .cal.sm .n { font-size:104px; } .cal.sm .d, .cal.sm .m { font-size:32px; }
  .strike { height:16px; background:var(--accent); border-radius:8px; }
  .dots { display:grid; gap:18px; }
  .dots i { display:block; border-radius:50%; background:rgba(62,85,104,.25); }
  .dots i.on { background:var(--accent); }
  .dots.ov i { background:transparent; } .dots.ov i.on { background:var(--accent); }
  .person { display:flex; gap:22px; }
  .person i { display:block; width:70px; height:150px; position:relative; }
  .person i::before { content:''; position:absolute; left:15px; top:0; width:40px; height:40px; border-radius:50%; background:currentColor; }
  .person i::after { content:''; position:absolute; left:0; top:48px; width:70px; height:100px; border-radius:35px 35px 12px 12px; background:currentColor; }
  .phone { width:440px; height:620px; background:var(--ink); border-radius:56px; padding:26px; box-sizing:border-box; box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .phone .scr { background:#E9E4DA; border-radius:34px; height:100%; padding:30px 22px; box-sizing:border-box; display:flex; flex-direction:column; gap:18px; }
  .phone .bub { background:#fff; border-radius:22px 22px 22px 6px; padding:20px 22px; font-weight:800; font-size:36px; line-height:1.2; }
  .phone .who { font-weight:800; font-size:26px; color:var(--slate); }
  .budi { width:340px; height:453px; }
  .budi > div { position:absolute; inset:0; }
  .lower { bottom:auto; top:132px; }

  .dots i.dpd { background:var(--slate); }
  .seat { width:200px; height:210px; border-radius:26px; background:var(--ink); color:var(--hi); font-weight:900; font-size:40px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:0 0 0 9px #fff,0 18px 26px rgba(27,36,48,.22); }
  .seat small { color:#fff; font-size:26px; font-weight:800; }
  .seat.empty { background:transparent; border:8px dashed var(--accent); box-shadow:none; color:var(--accent); }
  .seat.empty small { color:var(--accent); }
  .gbar { position:absolute; width:170px; border-radius:18px 18px 0 0; background:var(--slate); opacity:0; }
  .gbar.acc { background:var(--accent); } .gbar.green { background:#2E8B57; } .gbar.down { border-radius:0 0 18px 18px; background:var(--accent); }
  .icon { width:150px; height:150px; display:block; margin:0 auto 12px; }
  .note { position:absolute; left:440px; top:50px; z-index:6; background:#fff; color:var(--slate); border:3px solid var(--slate); border-radius:12px;
          padding:5px 14px; font-weight:800; font-size:24px; opacity:0; }
  .check { color:#2E8B57; }
</style>

</head>
<body>
<!-- ch07. outro. -->
<div id="stage">
  <div id="world">
    <div class="it hd" id="e1" style="left:960px;top:250px;">Minggu ini</div>
    <div class="it chip acc" id="e2" style="left:340px;top:400px;font-size:40px">dua nama masuk</div>
    <div class="it chip" id="e3" style="left:960px;top:400px;font-size:40px">satu kursi sidang kosong</div>
    <div class="it chip light" id="e4" style="left:1580px;top:400px;font-size:40px">rupiah rekor terlemah</div>
    <div class="it card" id="e5" style="left:960px;top:590px;width:1400px">Mana yang paling <span class="acc">menentukan</span> minggu depan? Kenapa?</div>
    <div class="it chip hi" id="e6" style="left:960px;top:740px;">Tulis di komentar</div>
    <div class="it big" id="e7" style="left:2880px;top:400px;">Follow <span class="acc">Rangkumin Dong</span></div>
    <div class="it stamp" id="e8" style="left:2880px;top:560px;font-size:64px">Rangkumin Seminggu, tiap Sabtu pagi!</div>
    <div class="it lab" id="e9" style="left:2880px;top:700px;">Sumber di komentar</div>
  </div>
  <div id="card"><div class="kicker" id="cKick"></div><div class="title" id="cTitle"></div><div class="sub" id="cSub"></div></div>
  
  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
window.CHAPTER = Number(location.pathname.split('/').slice(-2)[0]);
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
const ch = (window.WEEK?.chapters || []).find((c) => c.n === window.CHAPTER) || {};
$('cKick').textContent = ch.kicker || ''; $('cTitle').textContent = ch.title || ''; $('cSub').textContent = window.WEEK?.dates || '';
const T0 = 2.15;  // nothing pops under the 2 s title card
const IT = [{id:"e1",tin:(K.at("o1")),tout:Infinity,rot:0},{id:"e2",tin:(K.word("o1","dua",0)),tout:Infinity,rot:-3},{id:"e3",tin:(K.word("o1","satu",0)),tout:Infinity,rot:2},{id:"e4",tin:(K.word("o1","rupiah",0)),tout:Infinity,rot:-2},{id:"e5",tin:(K.word("o1","menurutmu",0)),tout:Infinity,rot:0},{id:"e6",tin:(K.word("o1","tulis",0)),tout:Infinity,rot:-2},{id:"e7",tin:(K.at("o2")),tout:Infinity,rot:0},{id:"e8",tin:(K.word("o2","rangkumin",1)),tout:Infinity,rot:-2},{id:"e9",tin:(K.word("o2","rangkumin",1)+0.5),tout:Infinity,rot:0}].map((o) => ({...o, tin: Math.max(T0, o.tin), el: $(o.id)}));
const LOW = [].map(([id, a, b]) => [$(id), Math.max(T0 + 0.6, a), b]);
const CAM = [{t:0,x:960,y:540,z:1},{t:(K.at("o2"))-0.35,x:2880,y:540,z:1}];
IT.forEach((o) => { if (o.budi) o.el.querySelectorAll('[data-ex]').forEach((d) => { d.innerHTML = K.budi(d.dataset.ex); d.classList.add('sticker-svg'); }); });
const fmt = (v, dec) => v.toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
function seek(t) {
  K.cam16($('world'), CAM, t);
  K.titleCard($('card'), t, 2.0);
  IT.forEach((o) => {
    if (o.grow) { const s = K.spring(t - o.tin, 180, 20); o.el.style.opacity = t >= o.tin ? 1 : 0;
      o.el.style.transformOrigin = o.grow === 'down' ? '50% 0' : '50% 100%';
      o.el.style.transform = `translate(-50%,${o.grow === 'down' ? '0' : '-100%'}) scaleY(${Math.max(0, s)})`; }
    else if (o.fade) { o.el.style.opacity = K.clamp((t - o.tin) / 0.3) * (1 - K.clamp((t - o.tout) / 0.25)); o.el.style.transform = 'translate(-50%,-50%)'; }
    else K.pop(o.el, t, o.tin, o.tout, o.rot);
    if (o.draw) o.el.querySelectorAll('[data-draw]').forEach((p) => { p.style.strokeDashoffset = 1 - K.easeInOut(K.prog(t, o.tin, o.draw)); });
    if (o.cnt) { const [a, b, dec, t1] = o.cnt; $(o.id + 'n').textContent = fmt(a + (b - a) * K.easeOut(K.prog(t, Math.max(T0, t1), 1.0)), dec); }
    if (o.budi) { let cur = o.budi[0][0]; o.budi.forEach(([ex, tt]) => { if (t >= tt) cur = ex; });
      o.el.querySelectorAll('[data-ex]').forEach((d) => { d.style.display = d.dataset.ex === cur ? 'block' : 'none'; });
      o.el.style.transform += ` translateY(${Math.sin(t * 2.2) * 6}px)`; }
  });
  LOW.forEach(([el, a, b]) => K.lower(el, t, a, b));
  K.subtitles($('subs'), t);
  K.weekly(t);
}
window.seek = seek;
</script>
</body>
</html>
