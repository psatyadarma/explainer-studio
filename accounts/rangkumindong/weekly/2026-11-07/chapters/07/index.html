<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — chapter</title>
<!-- ../../../../../../ is replaced by engine/weekly.py init with the path back to the repo root -->
<link rel="stylesheet" href="../../../../../../styles/sticker/sticker.css">
<link rel="stylesheet" href="../../../../../../styles/sticker/weekly/weekly.css">
<script src="../../../../../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<script src="../../build/week.js"></script>
<script src="../../../../../../styles/sticker/weekly/weekly.js"></script>
<style>
  .q { font-weight: 900; font-size: 96px; line-height: 1.1; text-align: center; width: 1200px; }
  .q em { font-style: normal; color: var(--accent); }
  .big { font-weight: 900; font-size: 150px; letter-spacing: -4px; text-align: center; line-height: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <!-- ZONE A (x=960): the question -->
    <div id="qA" class="abs q" style="left:960px; top:440px;">Mana cerita yang paling perlu <em>dijelaskan lebih lanjut?</em></div>
    <div id="cmt" class="abs tag accent sticker" style="left:960px; top:760px;">Tulis di komentar</div>
    <!-- ZONE B (x=2960): follow -->
    <div id="fB" class="abs big" style="left:2960px; top:430px;">Follow</div>
    <div id="fB2" class="abs tag light sticker" style="left:2960px; top:620px;">Rangkumin Dong</div>
    <div id="fB3" class="abs tag accent sticker" style="left:2960px; top:790px;">Rangkumin Seminggu: tiap Sabtu pagi</div>
  </div>
  <div id="card"><div class="kicker" id="cKick"></div><div class="title" id="cTitle"></div><div class="sub" id="cSub"></div></div>
    <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
window.CHAPTER = Number(location.pathname.split('/').slice(-2)[0]);
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
const ch = (window.WEEK?.chapters || []).find((c) => c.n === window.CHAPTER) || {};
$('cKick').textContent = ch.kicker || ''; $('cTitle').textContent = ch.title || ''; $('cSub').textContent = window.WEEK?.dates || '';
const tB = K.at('o2', -0.1);
function seek(t) {
  K.cam16($('world'), [{ t: 0, x: 960, y: 540, z: 1 }, { t: tB, x: 2960, y: 540, z: 1 }], t);
  K.titleCard($('card'), t, 2.0);
  K.pop($('qA'), t, 2.1);
  K.pop($('cmt'), t, K.word('o1', 'tulis'), Infinity, -2);
  K.pop($('fB'), t, tB + 0.3);
  K.pop($('fB2'), t, tB + 0.6, Infinity, 2);
  K.pop($('fB3'), t, K.word('o2', 'rangkumin', 1), Infinity, -1);
  K.subtitles($('subs'), t);
  K.weekly(t);
}
window.seek = seek;
</script>
</body>
</html>
