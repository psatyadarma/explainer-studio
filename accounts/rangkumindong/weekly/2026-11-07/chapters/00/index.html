<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rangkumin Seminggu — chapter</title>
<!-- ../../../../../../ is replaced by engine/weekly.py init with the path back to the repo root -->
<link rel="stylesheet" href="../../../../../../styles/sticker/sticker.css">
<link rel="stylesheet" href="../../../../../../styles/sticker/weekly/weekly.css">
<script src="../../../../../../styles/sticker/sticker.js"></script>
<script src="build/timing.js"></script>
<script src="../../build/week.js"></script>
<script src="../../../../../../styles/sticker/weekly/weekly.js"></script>
<style>
  .zone { position:absolute; top:0; width:1920px; height:1080px; }
  .big { position:absolute; left:0; width:1920px; text-align:center; font-weight:900; letter-spacing:-3px; }
  .card3 { position:absolute; top:330px; width:520px; height:400px; background:#fff; border-radius:28px; text-align:center; padding-top:70px; box-sizing:border-box; }
  .card3 .n { font-weight:900; font-size:120px; letter-spacing:-4px; color:var(--accent); line-height:1; }
  .card3 .l { font-weight:800; font-size:42px; margin-top:26px; padding:0 24px; }
  .ic { position:absolute; top:330px; width:620px; height:360px; border-radius:28px; background:#fff; text-align:center; font-weight:900; font-size:60px; padding-top:110px; box-sizing:border-box; line-height:1.1; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="zone" style="left:0;">
      <div class="big" id="z1a" style="top:330px; font-size:150px;">Mantan Kapolri</div>
      <div class="big" id="z1b" style="top:520px; font-size:170px; color:var(--accent);">ditahan</div>
    </div>
    <div class="zone" style="left:2000px;">
      <div class="card3 sticker" id="c1" style="left:150px;"><div class="n">4</div><div class="l">tersangka keempat</div></div>
      <div class="card3 sticker" id="c2" style="left:700px;"><div class="n">Rp114 T</div><div class="l">kripto dibobol</div></div>
      <div class="card3 sticker" id="c3" style="left:1250px;"><div class="n">&lt; 5.000</div><div class="l">IHSG sempat jatuh</div></div>
    </div>
    <div class="zone" style="left:4000px;">
      <div class="ic sticker" id="d1" style="left:230px;">Ekonomi tumbuh<br><span style="color:var(--accent)">di atas perkiraan</span></div>
      <div class="ic sticker" id="d2" style="left:1070px;">Asap<br><span style="color:var(--accent)">naik lagi</span></div>
    </div>
    <div class="zone" style="left:6000px;">
      <div class="big" id="e1" style="top:300px; font-size:110px;">31 Oktober – 6 November</div>
      <div class="big" id="e2" style="top:480px; font-size:70px; color:var(--slate);">+ tanggal-tanggal minggu depan</div>
      <div class="big" id="e3" style="top:600px; font-size:70px; color:var(--accent);">satu tanggal pajak yang ramai</div>
    </div>
  </div>
  <div id="card"><div class="kicker" id="cKick"></div><div class="title" id="cTitle"></div><div class="sub" id="cSub"></div></div>
  <div id="brand"><div class="dot"></div><b>Rangkumin Dong</b></div>
  <div id="subs"></div>
  <div id="progress"></div>
</div>
<script>
window.CHAPTER = Number(location.pathname.split('/').slice(-2)[0]);
const $ = (id) => document.getElementById(id);
const T = window.TIMING; window.DURATION = T.duration;
const ch = (window.WEEK?.chapters || []).find((c) => c.n === window.CHAPTER) || {};
$('cKick').textContent = ch.kicker || ''; $('cTitle').textContent = ch.title || ''; $('cSub').textContent = window.WEEK?.dates || '';
const S = {}; T.lines.forEach((l) => { S[l.id] = l.start; });
const w = (id, k) => T.lines.find((l) => l.id === id).words[k].start;
// cue times, all taken from the voice timings
const cue = { z1: Math.max(0.3, S.i1), c1: S.i2 + 0.1, c2: w('i2', 4), c3: w('i2', 8), d1: S.i3, d2: w('i3', 7), e1: S.i4, e2: S.i4 + 3.2, e3: S.i4 + 5.5 };
const appear = (el, t, t0) => { const k = K.spring(t - t0, 260, 18); el.style.opacity = t < t0 ? 0 : K.clamp(k * 1.5); el.style.transform = `scale(${0.7 + 0.3 * k})`; };
function seek(t) {
  K.cam16($('world'), [
    { t: 0, x: 960, y: 540, z: 1 }, { t: S.i2 - 0.4, x: 960, y: 540, z: 1.05 },
    { t: S.i2 + 0.2, x: 2960, y: 540, z: 1 }, { t: S.i3 - 0.4, x: 2960, y: 540, z: 1.04 },
    { t: S.i3 + 0.2, x: 4960, y: 540, z: 1 }, { t: S.i4 - 0.4, x: 4960, y: 540, z: 1.04 },
    { t: S.i4 + 0.2, x: 6960, y: 540, z: 1 }], t);
  K.titleCard($('card'), t, 0.3);
  appear($('z1a'), t, cue.z1); appear($('z1b'), t, cue.z1 + 0.5);
  ['c1', 'c2', 'c3', 'd1', 'd2', 'e1', 'e2', 'e3'].forEach((id) => appear($(id), t, cue[id]));
  K.subtitles($('subs'), t);
  K.weekly(t);
}
window.seek = seek;
</script>
</body>
</html>
